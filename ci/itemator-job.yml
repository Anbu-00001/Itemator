# The job that a pipeline execution policy injects into every merge request pipeline of this project (the policy lives
# in a separate policy project), so a merge request cannot edit, delete or skip it. The copy that runs is the one in that policy
# project (its main branch, which the flow accounts cannot push to); this copy is for the tests and the job `policy-job-in-sync`
# fails the pipeline if the two differ.
# The facts for the card: fixed rules, no model. The Duo flow reads the artifact.
# The checker comes from the target branch (T20, T26 F1): itemator/ is exported from the tip of the target branch
# (origin/<target>, fetched here; the merge base CI_MERGE_REQUEST_DIFF_BASE_SHA when that ref cannot be read, and
# the card then says so) into a directory outside the checkout and run from there, so a merge request that edits
# itemator/ cannot rewrite the code that judges it. Only when that commit has no itemator/ci.py yet does the merge
# request's own copy run, and the card says so. The job definition itself comes from the policy, not from the merge request.
itemator:
  stage: .pipeline-policy-post
  # The Alpine image is 21 MB compressed (slim 43 MB, full 412 MB) and its git comes from apk (about 10 MB on every run, against
  # 24 MB from apt on slim). Same extras as the slim job on a merge request with two (results/alpine_trial_v1.json).
  image: python:3.12-alpine
  variables:
    GIT_DEPTH: "0"
    ITEMATOR_REACT_BOT: ai-itemator-react-gitlab-ai-hackathon
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      when: always
  before_script:
    - apk add -q --no-cache git ca-certificates
    - git config --global --add safe.directory "$CI_PROJECT_DIR"
  script:
    - |
      set -eu
      export ITEMATOR_REACT_BOT=ai-itemator-react-gitlab-ai-hackathon     # set here, not only as a variable: no project variable can change who is believed
      base="${CI_MERGE_REQUEST_DIFF_BASE_SHA:-}"
      target="${CI_MERGE_REQUEST_TARGET_BRANCH_NAME:-}"
      tip=""
      if [ -n "$target" ]; then
        git fetch -q --no-tags origin "+refs/heads/$target:refs/remotes/origin/$target" 2>/dev/null || true
        tip="$(git rev-parse -q --verify "refs/remotes/origin/$target^{commit}" 2>/dev/null || true)"
      fi
      case "$tip" in
        *[!0-9a-f]*|"") tip="$base" ;;
      esac
      [ "${#tip}" -eq 40 ] || tip="$base"
      checker=merge_request
      dir="$CI_PROJECT_DIR"
      case "$tip" in
        *[!0-9a-f]*) ;;
        *)
          if [ "${#tip}" -eq 40 ] && git cat-file -e "$tip:itemator/ci.py" 2>/dev/null; then
            dir="$(mktemp -d)"
            git archive --format=tar -o "$dir.tar" "$tip" itemator
            tar -x -f "$dir.tar" -C "$dir"
            checker=base
          fi
          ;;
      esac
      cd "$dir"
      status=0
      ITEMATOR_CHECKER="$checker" ITEMATOR_CHECKER_SHA="$tip" python -E -m itemator.ci --repo "$CI_PROJECT_DIR" --out "$CI_PROJECT_DIR/itemator.json" || status=$?
      # The same record in GitLab's own report formats (Code Quality: one finding per extra; Metrics: counts and download).
      # Information only: a failure here never changes the job's result, which stays the checker's.
      python -E -m itemator.glreports "$CI_PROJECT_DIR/itemator.json" --codequality "$CI_PROJECT_DIR/gl-code-quality-report.json" --metrics "$CI_PROJECT_DIR/metrics.txt" || true
      exit "$status"
  artifacts:
    paths:
      - itemator.json
    reports:
      codequality: gl-code-quality-report.json
      metrics: metrics.txt
    expire_in: 30 days
    when: always

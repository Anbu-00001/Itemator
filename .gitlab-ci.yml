# Secure: GitLab's own secret detection and static analysis (SAST) templates run on every pipeline; they report and never block.
include:
  - template: Jobs/Secret-Detection.gitlab-ci.yml
  - template: Jobs/SAST.gitlab-ci.yml

variables:
  AST_ENABLE_MR_PIPELINES: "true"      # the templates skip merge request pipelines unless this is set

secret_detection:
  allow_failure: true

semgrep-sast:
  allow_failure: true

# One pipeline per change: a merge request pipeline while an MR is open,
# otherwise a branch pipeline (GitLab's documented pattern).
workflow:
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH

# The unit tests run on every pipeline (the duckdb file only reads the AIDev data used for the evaluation).
unit-tests:
  image: python:3.12
  variables:
    GIT_DEPTH: "0"
  script:
    - python -m venv .venv
    - .venv/bin/pip install -q pytest pyyaml
    - .venv/bin/python -m pytest -q --ignore=tests/test_review_stats.py

# The copy of ci/itemator-job.yml that the policy injects lives in the policy project. This job fails when it differs from the copy
# here (the tests read this one), so a change to either side cannot go unnoticed.
policy-job-in-sync:
  image: python:3.12
  script:
    - python -c "import urllib.request as u; open('/tmp/policy-copy.yml','wb').write(u.urlopen('https://gitlab.com/api/v4/projects/87623122/repository/files/ci%2Fitemator-job.yml/raw?ref=main', timeout=30).read())"
    - diff -u /tmp/policy-copy.yml ci/itemator-job.yml

hardcode-audit:
  image: python:3.12
  variables:
    GIT_DEPTH: "0"
  script:
    - python tools/hardcode_audit.py

# The `itemator` job is not defined here: a pipeline execution policy injects it (ci/itemator-job.yml, read from main), so a
# merge request cannot edit, delete or skip it.

# Mutation tests (eval/mutate_extras.py and eval/mutate_ci.py): they break the rules or the job one line at a time and
# every mutant must make a test fail. Manual, because a run takes several minutes; start it from the pipeline page.
# The laptop that builds this project overheats on it, so it runs here. mutation.log is the evidence.
mutation-suite:
  image: python:3.12
  when: manual
  allow_failure: true
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: manual
  script:
    - set -o pipefail
    - python -m venv .venv
    - .venv/bin/pip install -q pytest pyyaml
    - .venv/bin/python -I eval/mutate_extras.py "$CI_PROJECT_DIR" /tmp/mut-extras 2>&1 | tee mutation-extras.log | tail -5
    - .venv/bin/python -I eval/mutate_ci.py "$CI_PROJECT_DIR" /tmp/mut-ci 2>&1 | tee mutation-ci.log | tail -5
  artifacts:
    paths:
      - mutation-extras.log
      - mutation-ci.log
    expire_in: 30 days
    when: always

# The decision log (itemator/decisions.py): who decided each extra in the merge requests merged since the last release.
# On a tag it also writes the section into that release's description (job token, Releases API); on the default branch it
# is a manual report for the last 30 days. It only reads merge requests and their notes.
decision-log:
  image: python:3.12
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: manual
      allow_failure: true
  script:
    - python -E -m itemator.decisions --target "${DECISIONS_TARGET:-$CI_DEFAULT_BRANCH}" --days "${DECISIONS_DAYS:-30}"
  artifacts:
    paths:
      - decisions.json
      - decisions.md
    expire_in: 90 days
    when: always

# Scan history (itemator/scan.py): the same rules over the merge requests already merged into the default branch, each
# read as it landed (its merge or squash commit), so a team sees what went beyond its issue before Itemator was there.
# Manual; it only reads; no Duo credits. SCAN_LAST sets how many (default 50).
scan-history:
  image: python:3.12
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: manual
      allow_failure: true
  variables:
    GIT_DEPTH: "0"
  script:
    - python -E -m itemator.scan --target "$CI_DEFAULT_BRANCH" --last "${SCAN_LAST:-50}"
  artifacts:
    paths:
      - scan.json
      - scan.md
    expire_in: 90 days
    when: always

# The deployment page. `publish-package` is the deployment: it uploads the checker (itemator/) to this project's package
# registry and records a deployment of the `production` environment. `shipped-page` then publishes, with GitLab Pages, the page "what shipped": for each
# deployment, the merge requests in it, their extras and who named each (itemator/shipped.py; it only reads GitLab).
publish-package:
  stage: deploy
  image: python:3.12
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  environment:
    name: production
  script:
    - tar czf itemator.tar.gz itemator
    - 'curl --fail --silent --show-error --header "JOB-TOKEN: $CI_JOB_TOKEN" --upload-file itemator.tar.gz "$CI_API_V4_URL/projects/$CI_PROJECT_ID/packages/generic/itemator/0.1.$CI_PIPELINE_IID/itemator.tar.gz"'

shipped-page:
  stage: .post
  image: python:3.12
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  script:
    - python -E -m itemator.shipped --environment production --out public
    # The routing picture (public/map): the latest merge to main as a real trace (best effort) and a staged example.
    - python -E examples/make_example.py staged.json
    - python -E -m itemator.trace --commits --base HEAD~1 --head HEAD --out latest.json || true
    - python -E -m itemator.mapview --out public/map --skip-missing --label "Latest merge to main (a real run)" --label "Staged example (made up for this demonstration)" --staged staged.json latest.json staged.json
  pages: true

# Monitor: after each deployment of the page, fetch it from the internet and fail loudly if it, or the map page, is not served.
# GitLab Pages needs a little time after the job ends, so the check waits and tries again.
pages-smoke-check:
  stage: .post
  image: python:3.12
  needs: [shipped-page]
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  allow_failure: true
  script:
    - python -E tools/smoke_check.py "$CI_PAGES_URL" "$CI_PAGES_URL/map/"

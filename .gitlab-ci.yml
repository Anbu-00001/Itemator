# Secure: GitLab's own secret detection and static analysis (SAST) templates run on every pipeline; they report and never block.
include:
  - template: Jobs/Secret-Detection.gitlab-ci.yml
  - template: Jobs/SAST.gitlab-ci.yml

variables:
  AST_ENABLE_MR_PIPELINES: "true"      # the templates skip merge request pipelines unless this is set

secret_detection:
  allow_failure: true

semgrep-sast:
  allow_failure: true

# One pipeline per change: a merge request pipeline while an MR is open,
# otherwise a branch pipeline (GitLab's documented pattern).
workflow:
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH

# The unit tests run on every pipeline (the duckdb files only read the AIDev data used for the evaluation).
unit-tests:
  image: python:3.12-alpine
  variables:
    GIT_DEPTH: "0"
  before_script:
    - apk add -q --no-cache git ca-certificates file
  script:
    - python -m venv .venv
    - .venv/bin/pip install -q pytest pyyaml
    - .venv/bin/python -m pytest -q --ignore=tests/test_review_stats.py --ignore=tests/test_aidev_local.py

# The copy of ci/itemator-job.yml that the policy injects lives in the policy project. This job fails when it differs from the copy
# here (the tests read this one), so a change to either side cannot go unnoticed.
policy-job-in-sync:
  image: python:3.12-alpine
  script:
    - python -c "import urllib.request as u; open('/tmp/policy-copy.yml','wb').write(u.urlopen('https://gitlab.com/api/v4/projects/87623122/repository/files/ci%2Fitemator-job.yml/raw?ref=main', timeout=30).read())"
    - diff -u /tmp/policy-copy.yml ci/itemator-job.yml

hardcode-audit:
  image: python:3.12-alpine
  variables:
    GIT_DEPTH: "0"
  before_script:
    - apk add -q --no-cache git ca-certificates
  script:
    - python tools/hardcode_audit.py

# The `itemator` job is not defined here: a pipeline execution policy injects it (ci/itemator-job.yml, read from main), so a
# merge request cannot edit, delete or skip it.

# Another scope checker (itemator/other.py): Overreach, MIT, offline and with no key, named more of the files reviewers
# objected to than Itemator's own rules in the registered head-to-head (results/head_to_head_v1.json). Its output goes to
# the injected itemator job as an artifact (a later stage downloads it), read through the project variable
# ITEMATOR_OTHER_CHECKER=overreach.json. A merge request can edit this job, so its findings can only add questions: the
# checker keeps only changed files and strips mentions and links from the reasons. A failure here leaves the itemator job
# to its own rules, and the card says the file could not be read.
other-checker:
  stage: test
  image: node:22-alpine
  variables:
    GIT_DEPTH: "0"
    OVERREACH_TELEMETRY: "off"
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  allow_failure: true
  before_script:
    - apk add -q --no-cache git
  script:
    - git fetch -q --no-tags origin "+refs/heads/$CI_MERGE_REQUEST_TARGET_BRANCH_NAME:refs/remotes/origin/$CI_MERGE_REQUEST_TARGET_BRANCH_NAME"
    - git diff "$CI_MERGE_REQUEST_DIFF_BASE_SHA" HEAD > change.diff
    - node ci/other_checker_task.mjs > task.txt
    - npx -y overreach@0.9.0 --prompt-file task.txt --diff change.diff --json --no-cache > overreach.json || true
    - node -e 'const f=JSON.parse(require("fs").readFileSync("overreach.json","utf8")).findings||[];console.log("overreach named", f.length)'
  artifacts:
    paths:
      - overreach.json
    expire_in: 30 days
    when: always

# Mutation tests (eval/mutate_extras.py, eval/mutate_ci.py and eval/mutate_checks.py): they break the rules or the job one line at a time and
# every mutant must make a test fail. Manual, because a run takes several minutes; start it from the pipeline page.
# The laptop that builds this project overheats on it, so it runs here. mutation.log is the evidence.
mutation-suite:
  image: python:3.12
  when: manual
  allow_failure: true
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: manual
  script:
    - set -o pipefail
    - python -m venv .venv
    - .venv/bin/pip install -q pytest pyyaml
    - .venv/bin/python -I eval/mutate_extras.py "$CI_PROJECT_DIR" /tmp/mut-extras 2>&1 | tee mutation-extras.log | tail -5
    - .venv/bin/python -I eval/mutate_ci.py "$CI_PROJECT_DIR" /tmp/mut-ci 2>&1 | tee mutation-ci.log | tail -5
    - .venv/bin/python -I eval/mutate_checks.py "$CI_PROJECT_DIR" /tmp/mut-checks 2>&1 | tee mutation-checks.log | tail -5
  artifacts:
    paths:
      - mutation-extras.log
      - mutation-ci.log
      - mutation-checks.log
    expire_in: 90 days     # results/mutation.json links this job; keep it past the winners' announcement
    when: always

# The decision log (itemator/decisions.py): who decided each extra in the merge requests merged since the last release.
# On a tag it also writes the section into that release's description (job token, Releases API); on the default branch it
# is a manual report for the last 30 days. It only reads merge requests and their notes.
decision-log:
  image: python:3.12
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: manual
      allow_failure: true
  script:
    - python -E -m itemator.decisions --target "${DECISIONS_TARGET:-$CI_DEFAULT_BRANCH}" --days "${DECISIONS_DAYS:-30}"
  artifacts:
    paths:
      - decisions.json
      - decisions.md
    expire_in: 90 days
    when: always

# Scan history (itemator/scan.py): the same rules over the merge requests already merged into the default branch, each
# read as it landed (its merge or squash commit), so a team sees what went beyond its issue before Itemator was there.
# Manual; it only reads; no Duo credits. SCAN_LAST sets how many (default 50).
scan-history:
  image: python:3.12
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: manual
      allow_failure: true
  variables:
    GIT_DEPTH: "0"
  script:
    - python -E -m itemator.scan --target "$CI_DEFAULT_BRANCH" --last "${SCAN_LAST:-50}"
  artifacts:
    paths:
      - scan.json
      - scan.md
    expire_in: 90 days
    when: always

# The weight study (eval/aidev_weight.py, registered in eval/aidev_weight_rubric.json before it ran): what the new PyPI and npm
# dependencies in AI agents' pull requests bring along. Manual, on any branch or merge request; it reads the public AIDev dataset (1.3 GB) and the
# registries, posts nothing and uses no Duo credits. It runs here because the laptop cannot hold it.
weight-study:
  image: python:3.12
  rules:
    - if: $CI_COMMIT_BRANCH || $CI_MERGE_REQUEST_IID
      when: manual
      allow_failure: true
  timeout: 2h
  script:
    - pip install -q duckdb==1.1.3
    - curl --fail --silent --show-error --location -o /tmp/pr_commit_details.parquet https://huggingface.co/datasets/hao-li/AIDev/resolve/main/pr_commit_details.parquet
    - python -u eval/aidev_weight.py --commit-details /tmp/pr_commit_details.parquet
  artifacts:
    paths:
      - results/aidev_weight_v1.json
    expire_in: 90 days
    when: always

# The repeat-question study (eval/aidev_repeats.py, registered in eval/aidev_repeats_rubric.json before it ran): of the questions the
# rules would ask on public AI-agent pull requests, how many repeat a file the same repository was already asked about. Manual; no Duo credits.
repeats-study:
  image: python:3.12
  rules:
    - if: $CI_COMMIT_BRANCH || $CI_MERGE_REQUEST_IID
      when: manual
      allow_failure: true
  timeout: 3h
  parallel: 4
  script:
    - pip install -q duckdb==1.1.3
    - curl --fail --silent --show-error --location -o /tmp/pr_commit_details.parquet https://huggingface.co/datasets/hao-li/AIDev/resolve/main/pr_commit_details.parquet
    - python -u eval/aidev_repeats.py --commit-details /tmp/pr_commit_details.parquet --shard $((CI_NODE_INDEX - 1))/$CI_NODE_TOTAL
  artifacts:
    paths:
      - results/aidev_repeats_rows_*.json
    expire_in: 90 days
    when: always

repeats-tally:
  image: python:3.12
  needs: [repeats-study]
  rules:
    - if: $CI_COMMIT_BRANCH || $CI_MERGE_REQUEST_IID
      when: manual
      allow_failure: true
  script:
    - python -u eval/aidev_repeats.py --tally results/aidev_repeats_rows_*.json
  artifacts:
    paths:
      - results/aidev_repeats_v1.json
    expire_in: 90 days

# The install-time study (eval/install_time.py, registered in eval/install_time_rubric.json before it ran): seconds on this runner for a
# fresh install of the dependencies the weight study weighed. Manual, on any branch or merge request; wheels only and no npm install scripts, so no
# package code runs; no Duo credits.
.install-time:
  rules:
    - if: $CI_COMMIT_BRANCH || $CI_MERGE_REQUEST_IID
      when: manual
      allow_failure: true
  timeout: 1h
  artifacts:
    paths:
      - results/install_time_*_v1.json
    expire_in: 90 days
    when: always

install-time-pypi:
  extends: .install-time
  image: python:3.12
  script:
    - python -u eval/install_time.py --ecosystem PyPI

install-time-npm:
  extends: .install-time
  image: node:22
  script:
    - python3 -u eval/install_time.py --ecosystem npm

# The deployment page. `publish-package` is the deployment: it uploads the checker (itemator/) to this project's package
# registry and records a deployment of the `production` environment. `shipped-page` then publishes, with GitLab Pages, the page "what shipped": for each
# deployment, the merge requests in it, their extras and who named each (itemator/shipped.py; it only reads GitLab).
publish-package:
  stage: deploy
  image: python:3.12-alpine
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  environment:
    name: production
    url: https://showcase-3cd72e.gitlab.io/
  # Two merges in a row deploy one after the other, never together. DEPLOY_TARGET is a project variable scoped to the
  # `production` environment (Settings > CI/CD > Variables); it is empty in any other job.
  resource_group: production
  before_script:
    - apk add -q --no-cache curl
  script:
    - echo "Deploying to ${DEPLOY_TARGET:-no environment-scoped variable set}"
    - tar czf itemator.tar.gz itemator
    - 'curl --fail --silent --show-error --header "JOB-TOKEN: $CI_JOB_TOKEN" --upload-file itemator.tar.gz "$CI_API_V4_URL/projects/$CI_PROJECT_ID/packages/generic/itemator/0.1.$CI_PIPELINE_IID/itemator.tar.gz"'

# The same checks over HTTP on Google Cloud Run (itemator/serve.py, Dockerfile). The job is in the pipeline only when GCP_PROJECT_ID is set
# (Settings > CI/CD > Variables) and runs by hand; it signs in with a Workload Identity Federation token (no key file is stored anywhere).
# GCP_WIF_AUDIENCE is the provider's full resource name, e.g. //iam.googleapis.com/projects/NUMBER/locations/global/workloadIdentityPools/POOL/providers/PROVIDER.
# The service takes at most one instance, 20 requests at once and a 10-second request, and keeps nothing. Do not run it after Oct 27 13:00 UTC.
deploy-cloud-run:
  stage: deploy
  image: google/cloud-sdk:slim
  rules:
    - if: $GCP_PROJECT_ID && $GCP_WIF_AUDIENCE && $GCP_SERVICE_ACCOUNT && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: manual
  id_tokens:
    GCP_ID_TOKEN:
      aud: $GCP_WIF_AUDIENCE
  variables:
    GCP_REGION: us-central1
  script:
    - echo "$GCP_ID_TOKEN" > "$CI_PROJECT_DIR/.gcp-token"
    - gcloud iam workload-identity-pools create-cred-config "${GCP_WIF_AUDIENCE#//iam.googleapis.com/}" --service-account="$GCP_SERVICE_ACCOUNT" --credential-source-file="$CI_PROJECT_DIR/.gcp-token" --output-file="$CI_PROJECT_DIR/.gcp-cred.json"
    - gcloud auth login --cred-file="$CI_PROJECT_DIR/.gcp-cred.json" --quiet
    - gcloud run deploy itemator-check --project="$GCP_PROJECT_ID" --region="$GCP_REGION" --source=. --allow-unauthenticated --max-instances=1 --concurrency=20 --timeout=10 --memory=256Mi --cpu=1 --quiet
    - URL=$(gcloud run services describe itemator-check --project="$GCP_PROJECT_ID" --region="$GCP_REGION" --format='value(status.url)')
    - echo "CLOUD_RUN_URL=$URL" > deploy.env
    - 'curl --fail --silent --show-error "$URL/" | grep -q "\"stores\": \"nothing\""'
    - 'curl --fail --silent --show-error --data-binary @examples/cloud-run-sample.diff "$URL/check" | grep -q "\"named\": 1"'
  after_script:
    - rm -f "$CI_PROJECT_DIR/.gcp-token" "$CI_PROJECT_DIR/.gcp-cred.json"
  environment:
    name: google-cloud
    url: $CLOUD_RUN_URL
  artifacts:
    reports:
      dotenv: deploy.env

shipped-page:
  stage: .post
  image: python:3.12-alpine
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  before_script:
    - apk add -q --no-cache git ca-certificates
  script:
    # The answer log (public/answers): every recorded answer, hash-chained, built on the copy this site published last.
    - python -E -m itemator.answerlog --out public/answers --owners anbuchelvanganesan.cse2024,anbuchelvannew --note "Answers from the owner's accounts come from our own test runs during the hackathon; some were posted by our test scripts. An answer from outside the project is marked."
    - python -E -m itemator.shipped --environment production --out public --answers public/answers/answers.json
    # The routing picture (public/map): the latest merge to main as a real trace (best effort) and a staged example.
    - python -E examples/make_example.py staged.json
    - python -E -m itemator.trace --commits --base HEAD~1 --head HEAD --out latest.json || true
    - python -E -m itemator.mapview --out public/map --skip-missing --label "Latest merge to main (a real run)" --label "Staged example (made up for this demonstration)" --staged staged.json latest.json staged.json
    # The page where a visitor pastes a diff and three checks run in the browser, with the numbers read from results/.
    - python -E -m itemator.tryit --out public/try
    # The page where a visitor weighs any PyPI or npm package in the browser, the way the card does (web/weigh.js).
    - python -E -m itemator.weighpage --out public/weigh
    # The green check: paste a change and its issue; the new dependencies nobody asked for are weighed in the browser (web/green.html).
    - python -E -m itemator.greenpage --out public/green
    - python -E -m itemator.catchespage --out public/catches
    # The sealed forward test (public/sealed): open agent pull requests and what the rules listed, committed before any outcome.
    - python -E -m itemator.sealedpage --out public/sealed
  pages: true

# Deploy: every merge request gets its own preview of the reviewer's map for exactly that change (a GitLab Pages parallel deployment,
# `Pages MR <n>` in the environment list; GitLab puts the `mr-<n>` prefix into CI_PAGES_URL itself, so the link is that variable alone). Each preview is a real run of the trace on the request's own commits, expires after a week and
# is deleted when the request closes.
# Trial, run by hand: the same check on python:3.12-alpine (21 MB compressed against the policy job's 43 MB slim image) with git
# from apk, whose packages are fetched first so their size is measured (the slim job downloads git by apt on every run, about
# 24 MB). The policy job could switch only if the extras come out the same (eval/image_trial.py compares).
alpine-trial:
  stage: test
  image: python:3.12-alpine
  variables:
    GIT_DEPTH: "0"
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      when: manual
      allow_failure: true
  script:
    - mkdir -p /tmp/apk && apk fetch -q -R -o /tmp/apk git ca-certificates && du -sb /tmp/apk | tee apk-bytes.txt
    - apk add -q --no-network /tmp/apk/*.apk
    - git config --global --add safe.directory "$CI_PROJECT_DIR"
    - ITEMATOR_CHECKER=merge_request python -E -m itemator.ci --repo "$CI_PROJECT_DIR" --out itemator-alpine.json || true
  artifacts:
    paths:
      - itemator-alpine.json
      - apk-bytes.txt
    when: always

map-preview:
  stage: deploy
  image: python:3.12-alpine
  variables:
    GIT_DEPTH: "0"
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  before_script:
    - apk add -q --no-cache git ca-certificates
  script:
    - python -E -m itemator.trace --commits --base "$CI_MERGE_REQUEST_DIFF_BASE_SHA" --head "$CI_COMMIT_SHA" --out mr-trace.json
    - python -E -m itemator.mapview --out public --label "This merge request" mr-trace.json
  pages:
    path_prefix: "mr-$CI_MERGE_REQUEST_IID"
    expire_in: 7 days
  environment:
    name: "Pages MR $CI_MERGE_REQUEST_IID"
    url: "$CI_PAGES_URL"
  artifacts:
    paths:
      - public

# Monitor: after each deployment of the page, fetch it from the internet and fail loudly if it, or the map page, is not served.
# GitLab Pages needs a little time after the job ends, so the check waits and tries again.
pages-smoke-check:
  stage: .post
  image: python:3.12-alpine
  needs: [shipped-page]
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  allow_failure: true
  script:
    - python -E tools/smoke_check.py "$CI_PAGES_URL" "$CI_PAGES_URL/map/" "$CI_PAGES_URL/try/" "$CI_PAGES_URL/weigh/" "$CI_PAGES_URL/green/" "$CI_PAGES_URL/catches/" "$CI_PAGES_URL/sealed/" "$CI_PAGES_URL/answers/"
